<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <h1>Login</h1>

        <form>

            <label>Email</label>
            <input type="email" placeholder="Digite seu email">

            <label>Senha</label>
            <input type="password" placeholder="Digite sua senha">

            <button type="submit">
                Entrar
            </button>

        </form>

        <p>
            Não possui conta?
            <a href="cadastro.html">
                Cadastre-se
            </a>
        </p>

    </div>

</body>
</html>
