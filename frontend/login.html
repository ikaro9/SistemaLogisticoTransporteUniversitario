<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <h1>Login</h1>

        <form id="loginForm">

            <label>Email</label>
            <input
                id="email"
                type="email"
                placeholder="Digite seu email"
                required
            >

            <label>Senha</label>
            <input
                id="senha"
                type="password"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p>
            Não possui conta?
            <a href="cadastro.html">
                Cadastre-se
            </a>
        </p>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
