<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <h1>Cadastro</h1>

        <form id="cadastroForm">

            <label>Nome</label>
            <input
                id="nome"
                type="text"
                placeholder="Digite seu nome"
                required
            >

            <label>Email</label>
            <input
                id="email"
                type="email"
                placeholder="Digite seu email"
                required
            >

            <label>Telefone</label>
            <input
                id="telefone"
                type="text"
                placeholder="Digite seu telefone"
                required
            >

            <label>Cidade</label>
            <input
                id="cidade"
                type="text"
                placeholder="Digite sua cidade"
                required
            >

            <label>Senha</label>
            <input
                id="senha"
                type="password"
                placeholder="Digite sua senha"
                required
            >

            <label>Tipo de Perfil</label>

            <select id="tipo_perfil" required>
                <option value="">Selecione</option>
                <option value="Aluno">Aluno</option>
                <option value="Motorista">Motorista</option>
            </select>

            <label>Instituição</label>

            <select id="instituicao" required>
                <option value="">Selecione</option>
                <option value="UFERSA">UFERSA</option>
                <option value="IFRN">IFRN</option>
                <option value="FACEP">FACEP</option>
            </select>

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <p>
            Já possui conta?
            <a href="login.html">
                Entrar
            </a>
        </p>

    </div>

    <script src="js/cadastro.js"></script>

</body>
</html>
