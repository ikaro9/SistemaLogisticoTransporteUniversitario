<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participantes - Gestão de Participação em Rotas</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .participacao-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }

        .header-participacao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }

        .rota-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .rota-info h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }

        .rota-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .rota-detail-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
        }

        .rota-detail-item strong {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            opacity: 0.9;
        }

        .rota-detail-item span {
            display: block;
            font-size: 16px;
        }

        .vagas-info {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #28a745;
        }

        .vagas-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .vagas-filled {
            height: 100%;
            background: linear-gradient(90deg, #28a745 0%, #20c997 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            transition: width 0.3s ease;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin: 0 5px;
        }

        .status-confirmado {
            background: #d4edda;
            color: #155724;
        }

        .status-nao-confirmado {
            background: #fff3cd;
            color: #856404;
        }

        .status-cheia {
            background: #f8d7da;
            color: #721c24;
        }

        .acoes-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .btn-participacao {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-entrar {
            background: #007bff;
            color: white;
        }

        .btn-entrar:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 86, 179, 0.3);
        }

        .btn-confirmar {
            background: #28a745;
            color: white;
        }

        .btn-confirmar:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(33, 136, 56, 0.3);
        }

        .btn-cancelar {
            background: #dc3545;
            color: white;
        }

        .btn-cancelar:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(200, 35, 51, 0.3);
        }

        .btn-voltar {
            background: #6c757d;
            color: white;
            text-decoration: none;
        }

        .btn-voltar:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(90, 98, 104, 0.3);
        }

        .participantes-list {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .participantes-list h4 {
            background: #f8f9fa;
            padding: 15px;
            margin: 0;
            border-bottom: 1px solid #dee2e6;
            font-size: 18px;
            color: #333;
        }

        .participante-item {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
        }

        .participante-item:hover {
            background: #f8f9fa;
        }

        .participante-info {
            flex: 1;
        }

        .participante-nome {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }

        .participante-contato {
            font-size: 13px;
            color: #666;
            margin: 3px 0;
        }

        .participante-status {
            text-align: right;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .status-sua-participacao {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #0066cc;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .selector-rota {
            margin-bottom: 20px;
        }

        .selector-rota select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .rota-details {
                grid-template-columns: 1fr;
            }

            .participante-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .participante-status {
                text-align: left;
                margin-top: 10px;
                width: 100%;
            }

            .acoes-wrapper {
                flex-direction: column;
            }

            .btn-participacao {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="participacao-container">
        <div class="header-participacao">
            <h1>Participação em Rotas</h1>
            <a href="rotas.html" class="btn-participacao btn-voltar">← Voltar para Rotas</a>
        </div>

        <!-- Seletor de Rota -->
        <div class="selector-rota">
            <label for="rotaSelect"><strong>Selecione uma rota:</strong></label>
            <select id="rotaSelect">
                <option value="">Carregando rotas...</option>
            </select>
        </div>

        <!-- Mensagens -->
        <div id="mensagem" class="message"></div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Carregando informações...</p>
        </div>

        <!-- Informações da Rota -->
        <div id="rotaInfo" style="display: none;">
            <div class="rota-info">
                <h3 id="rotaNome"></h3>
                <div class="rota-details">
                    <div class="rota-detail-item">
                        <strong>Descrição</strong>
                        <span id="rotaDescricao"></span>
                    </div>
                    <div class="rota-detail-item">
                        <strong>Código</strong>
                        <span id="rotaCodigo"></span>
                    </div>
                    <div class="rota-detail-item">
                        <strong>Veículo</strong>
                        <span id="rotaVeiculo"></span>
                    </div>
                    <div class="rota-detail-item">
                        <strong>Placa</strong>
                        <span id="rotaPlaca"></span>
                    </div>
                </div>
            </div>

            <!-- Informações de Vagas -->
            <div class="vagas-info">
                <strong>Vagas Disponíveis:</strong> <span id="vagasTexto"></span>
                <div class="vagas-bar">
                    <div class="vagas-filled" id="vagasPreenchidas"></div>
                </div>
            </div>

            <!-- Status de Sua Participação -->
            <div id="suaParticipacao" class="status-sua-participacao" style="display: none;">
                <strong>Seu Status:</strong> <span id="seuStatus"></span>
            </div>

            <!-- Botões de Ação -->
            <div class="acoes-wrapper">
                <button id="btnEntrar" class="btn-participacao btn-entrar" style="display: none;">
                    ➕ Entrar nesta Rota
                </button>
                <button id="btnConfirmar" class="btn-participacao btn-confirmar" style="display: none;">
                    ✓ Confirmar Presença
                </button>
                <button id="btnCancelar" class="btn-participacao btn-cancelar" style="display: none;">
                    ✗ Cancelar Presença
                </button>
            </div>

            <!-- Lista de Participantes -->
            <div class="participantes-list">
                <h4>👥 Participantes da Rota</h4>
                <div id="participantesList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>Nenhum participante ainda</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Estado Vazio -->
        <div id="emptyState" style="display: none;">
            <div class="empty-state">
                <div class="empty-state-icon">🚗</div>
                <p>Nenhuma rota disponível</p>
            </div>
        </div>
    </div>

    <script src="js/participantes.js"></script>
</body>

</html>
